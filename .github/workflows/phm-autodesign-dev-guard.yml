name: PHM AutoDesign Dev Guard
on:
  pull_request:
    paths:
      - 'source_product/**'
      - '.github/workflows/phm-autodesign-dev-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage-and-task-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Synthetic-only leakage and task graph guards
        run: >-
          python -m pytest -q
          tests/phm_design/test_r74_environment_coherence.py
          tests/phm_design/test_r72_leakage_and_robust_search.py
          tests/phm_design/test_r72_robust_design_policy.py
          tests/phm_design/test_r69_task_graph.py
          tests/phm_design/test_r75_environment_exclusive_search.py
          tests/phm_design/test_r76_head_evidence.py
          tests/phm_design/test_r77_neural_domain_generalization.py
          tests/phm_design/test_r78_neural_risk_extrapolation.py
          tests/phm_design/test_r81a_unified_design_engine.py
          tests/phm_design/test_r81b_feature_and_variable_heads.py
          tests/phm_design/test_r81c_train_only_calibration.py
          tests/phm_design/test_r81c_feature_program_composition.py
          tests/phm_design/test_r81c_adaptive_feature_search.py
          tests/phm_design/test_open_design_dev7.py
          tests/phm_design/test_r81c_available_late_fusion.py
