name: R99 Explained Diagnostic Design and Measured Evidence Gates

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial_contracts/design_review.py'
      - 'source_product/src/phm_design/industrial_contracts/independent_review.py'
      - 'source_product/tests/phm_design/test_r99_design_review.py'
      - 'source_product/docs/R99_EXPLAIN_REVISE_VALIDATE.md'
      - '.github/workflows/r99-explain-revise-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-intelligence-evidence:
    name: Explained designs + sealed evaluator / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only numerical and existing estimator packages
        run: python -m pip install numpy scipy scikit-learn pytest
      - name: R93–R99 regressions: physics, source explanation, bounded repairs, genuine raw byte gates
        run: >-
          python -m pytest -q
          tests/phm_design/test_r93_industrial_contracts.py
          tests/phm_design/test_r94_torch_like_bridge.py
          tests/phm_design/test_r94_aas_bridge.py
          tests/phm_design/test_r95_diagnostic_design_engine.py
          tests/phm_design/test_r96_diagnostic_pipeline_design.py
          tests/phm_design/test_r97_signal_feature_design.py
          tests/phm_design/test_r97_cwru_signal_probe.py
          tests/phm_design/test_r98_physical_graph_design.py
          tests/phm_design/test_r98_cwru_envelope_probe.py
          tests/phm_design/test_r99_design_review.py
        env:
          PYTHONPATH: src
