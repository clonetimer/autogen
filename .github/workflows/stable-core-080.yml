name: phm-design 0.8.0 Stable Core -- Build, Test and Release

on:
  pull_request:
    paths:
      - 'README.md'
      - 'source_product/README.md'
      - 'source_product/pyproject.toml'
      - 'source_product/src/**'
      - 'source_product/scripts/stable_core_wheel_smoke.py'
      - 'source_product/tests/**'
      - 'source_product/docs/STABLE_080_RELEASE.md'
      - 'RELEASE_NOTES_080.md'
      - '.github/workflows/stable-core-080.yml'
      - '.github/workflows/stable-candidate-080.yml'
  push:
    branches: [main]
    paths:
      - 'source_product/pyproject.toml'
      - 'source_product/src/phm_design/__init__.py'
      - '.github/workflows/stable-core-080.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-distribution:
    name: Build Stable 0.8.0 wheel and source archive (strict metadata)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and strict package metadata verification
        run: python -m pip install build twine
      - name: Build version 0.8.0 archives
        run: python -m build --sdist --wheel source_product --outdir dist
      - name: Verify actual archive modules and metadata
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          import tomllib, zipfile, tarfile
          project=tomllib.loads(Path("source_product/pyproject.toml").read_text(encoding="utf-8"))
          assert project["project"]["version"] == "0.8.0"
          assert project["project"]["dependencies"] == [
            "torch==2.10.0", "numpy==2.3.5", "scikit-learn==1.8.0"
          ]
          wheels=list(Path("dist").glob("phm_design-0.8.0-*.whl"))
          sources=list(Path("dist").glob("phm_design-0.8.0.tar.gz"))
          assert len(wheels)==1 and len(sources)==1, (wheels,sources)
          with zipfile.ZipFile(wheels[0]) as archive:
            names=archive.namelist()
            assert all(module in names for module in (
              "phm_design/industrial_contracts/design_engine.py",
              "phm_design/industrial_contracts/physical_graph_design.py",
              "phm_design/industrial_contracts/design_review.py",
              "phm_design/industrial_contracts/independent_review.py",
            ))
          with tarfile.open(sources[0], "r:gz") as archive:
            assert any(n.endswith("/src/phm_design/industrial_contracts/design_cli.py")
                       for n in archive.getnames())
          PY
      - name: Freeze artifact SHA-256 checksums
        run: sha256sum dist/* | tee dist/SHA256SUMS
      - name: Verify checksum list before publication
        run: sha256sum -c dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phm-design-0.8.0-stable-core-built-artifacts
          path: dist/
          retention-days: 90
          if-no-files-found: error

  clean-core-install:
    name: Clean installed wheel / ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: build-distribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: phm-design-0.8.0-stable-core-built-artifacts
          path: dist
      - name: Install only official same-run built wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel=list(Path("dist").glob("phm_design-0.8.0-*.whl"))
          assert len(wheel)==1, wheel
          subprocess.check_call([sys.executable, "-m", "pip",
                                 "install", "--no-deps", str(wheel[0])])
      - name: Execute source-only proposal in another directory, no private torch_like
        run: python source_product/scripts/stable_core_wheel_smoke.py

  source-research-contract:
    name: R93-R99 research regression / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source-contract test dependencies (optional private native provider excluded)
        run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy pytest==9.0.2
      - name: R93-R99 source-only contracts, physical features, graph and review gates
        run: >-
          python -m pytest -q
          tests/phm_design/test_r93_industrial_contracts.py
          tests/phm_design/test_r94_torch_like_bridge.py
          tests/phm_design/test_r94_aas_bridge.py
          tests/phm_design/test_r95_diagnostic_design_engine.py
          tests/phm_design/test_r96_diagnostic_pipeline_design.py
          tests/phm_design/test_r97_signal_feature_design.py
          tests/phm_design/test_r97_cwru_signal_probe.py
          tests/phm_design/test_r98_physical_graph_design.py
          tests/phm_design/test_r98_cwru_envelope_probe.py
          tests/phm_design/test_r99_design_review.py
        env:
          PYTHONPATH: src

  full-legacy-regression:
    name: Complete previous Stable and R93-R99 regression / Ubuntu CPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pinned CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned regression dependencies
        run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0 pytest==9.0.2 optuna==4.8.0 scipy
      - name: Full no-bypass regression
        run: python -m pytest -q tests/phm_design
        env:
          PYTHONPATH: src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'

  publish-stable:
    name: Publish v0.8.0 Stable Core assets ONLY after all supported gates
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: phm-design 0.8.0 Stable Core') }}
    runs-on: ubuntu-latest
    needs: [build-distribution, clean-core-install, source-research-contract, full-legacy-regression]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phm-design-0.8.0-stable-core-built-artifacts
          path: dist
      - name: Check built output digest from same exact source commit
        run: |
          sha256sum -c dist/SHA256SUMS
          test -f dist/phm_design-0.8.0-py3-none-any.whl
          test -f dist/phm_design-0.8.0.tar.gz
          test "${{ github.ref }}" = "refs/heads/main"
      - name: Create stable GitHub Release tag and attach exact tested wheel, sdist and SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::v0.8.0 release already exists; refuse overwrite."
            exit 1
          fi
          gh release create v0.8.0             dist/phm_design-0.8.0-py3-none-any.whl             dist/phm_design-0.8.0.tar.gz             dist/SHA256SUMS             --repo "${{ github.repository }}"             --title "phm-design 0.8.0 Stable Core"             --notes-file RELEASE_NOTES_080.md             --target "${{ github.sha }}"             --latest
