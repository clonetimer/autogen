name: R96 Fold-Local Diagnostic Pipeline Design

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial_contracts/pipeline_design.py'
      - 'source_product/tests/phm_design/test_r96_diagnostic_pipeline_design.py'
      - 'source_product/docs/R96_FOLD_LOCAL_PIPELINE_DESIGN.md'
      - '.github/workflows/r96-pipeline-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-pipeline:
    name: Real sklearn, fold-train-only preprocessing / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual sklearn statistical backends for test only
        run: python -m pip install numpy scipy scikit-learn pytest
      - name: Test R93-R96 source-group contracts and real algorithm pipelines
        run: >-
          python -m pytest -q
          tests/phm_design/test_r93_industrial_contracts.py
          tests/phm_design/test_r94_torch_like_bridge.py
          tests/phm_design/test_r94_aas_bridge.py
          tests/phm_design/test_r95_diagnostic_design_engine.py
          tests/phm_design/test_r96_diagnostic_pipeline_design.py
        env:
          PYTHONPATH: src
