name: R89 External Bearing Cohort Feasibility

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial/r89_external_cohort_audit.py'
      - 'source_product/tests/phm_design/test_r89_external_cohort_audit.py'
      - 'source_product/README_R89.md'
      - '.github/workflows/r89-external-bearing-cohort.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-groups:
    name: External physical bearing groups / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical and test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Local MAT-byte and protected physical-group cohort preflight
        run: python -m pytest -q tests/phm_design/test_r89_external_cohort_audit.py
        env:
          PYTHONPATH: src
