name: R83j Read-Only Genuine Native FSW Evidence Gate

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial/r83j_native_fsw_reference_gate.py'
      - 'source_product/tests/phm_design/test_r83j_native_fsw_reference_gate.py'
      - '.github/workflows/r83j-native-fsw-reference-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  anti-fabrication-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pip install -e ./source_product --no-deps
      - run: python -m pytest -q source_product/tests/phm_design/test_r83j_native_fsw_reference_gate.py

  original-upstream-basilisk-source-verified:
    needs: anti-fabrication-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download upstream original actual 2-arm native Basilisk FSW evidence, not a proxy
        uses: actions/download-artifact@v4
        with:
          name: r83j-actual-native-basilisk-scheduled-reference-physics
          run-id: 40111820380
          repository: clonetimer/SatAgentSimulation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r83j_original_actual
      - name: Verify original unmodified FSW source and issue READ-ONLY physics receipt
        shell: bash
        run: |
          python -m pip install -e ./source_product --no-deps
          python -m phm_design.industrial.r83j_native_fsw_reference_gate \
            --source-file "$RUNNER_TEMP/r83j_original_actual/actual_original_native_fsw_schedule.json" \
            --output "$RUNNER_TEMP/r83j_native_proof_no_diagnostic_claim.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["RUNNER_TEMP"])/"r83j_native_proof_no_diagnostic_claim.json"
          o=json.loads(f.read_text())
          assert o["native_fsw_reference_to_rw_physical_response_observed"]
          assert not o["autogen_algorithm_eligible_from_this_evidence"]
          assert not o["stable_release_eligible_from_this_evidence"]
          assert not o["independent_hardware_safety_certified"]
          assert not o["no_training_or_model_selection_performed"] is False
          assert o["validation_test_final_telemetry_not_opened"]
          print("R83J_ORIGINAL_BASILISK_ONLY_PHYSICS_EVIDENCE_ACCEPTED",
                o["max_actual_paired_rw_speed_difference_rad_s"])
          PY
      - name: Archive immutable physics-only autogen proof, not diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r83j-autogen-readonly-original-bsk-fsw-coupling-proof
          retention-days: 21
          if-no-files-found: warn
          path: ${{ runner.temp }}/r83j_native_proof_no_diagnostic_claim.json
