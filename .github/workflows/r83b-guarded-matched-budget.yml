name: R83b Guard and Matched-Budget Research
on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial/self_organizing.py'
      - 'source_product/src/phm_design/industrial/self_organizing_guard.py'
      - 'source_product/src/phm_design/industrial/r83_matched_budget.py'
      - 'source_product/tests/phm_design/test_r83_self_organizing.py'
      - 'source_product/tests/phm_design/test_r83b_guard.py'
      - 'source_product/tests/phm_design/test_r83b_matched_budget.py'
      - 'source_product/tests/phm_design/test_r84_matched_ablation.py'
      - 'source_product/tests/phm_design/test_r84_pareto_training.py'
      - 'source_product/README_R83B.md'
      - '.github/workflows/r83b-guarded-matched-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: R83b real spawn, timeout, native staging and budget controls
        run: >-
          python -m pytest -q
          tests/phm_design/test_r83_self_organizing.py
          tests/phm_design/test_r83b_guard.py
          tests/phm_design/test_r83b_matched_budget.py
          tests/phm_design/test_r84_matched_ablation.py
          tests/phm_design/test_r84_pareto_training.py
          tests/phm_design/test_r81c_adaptive_feature_search.py
