name: R84 Self-Organizing Pareto Search Policy

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial/r84_pareto_search.py'
      - 'source_product/src/phm_design/industrial/self_organizing.py'
      - 'source_product/src/phm_design/industrial/self_organizing_guard.py'
      - 'source_product/tests/phm_design/test_r84_pareto_search.py'
      - '.github/workflows/r84-pareto-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-search-contract:
    name: R84 strategy on ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<10'
      - name: Validate pure candidate generation against adversarial source feedback
        run: python -m pytest -q source_product/tests/phm_design/test_r84_pareto_search.py
        env:
          PYTHONPATH: source_product/src
