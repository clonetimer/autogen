name: R94 Torch-Like Native Candidate Adapter

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial_contracts/**'
      - 'source_product/examples/industrial_contracts/**'
      - 'source_product/tests/phm_design/test_r94_torch_like_bridge.py'
      - 'source_product/docs/R94_TORCH_LIKE_PROVIDER_REUSE.md'
      - '.github/workflows/r94-torch-like-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary-contract:
    name: Provider delegation contract / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Test real R93 source scope and torch_like bridge delegation using provider spy
        run: python -m pytest -q tests/phm_design/test_r93_industrial_contracts.py tests/phm_design/test_r94_torch_like_bridge.py -k "not real_torch_like"
        env:
          PYTHONPATH: src

  pinned-real-provider-integration:
    name: Real torch_like factory, runtime, native sklearn, trusted persistence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - name: Checkout torch_like separately, PIN exact reviewed provider revision
        uses: actions/checkout@v4
        with:
          repository: clonetimer/torch_like
          ref: 1e603915896e33fd9f326073c42a477718166b68
          path: source_product/_r94_provider/torch_like
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real numerical provider dependencies
        run: python -m pip install numpy pandas scikit-learn PyYAML pytest joblib
      - name: Install CPU PyTorch for genuine torch_like package import
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned external torch_like package without changing autogen requirements
        run: python -m pip install --no-deps -e _r94_provider/torch_like
      - name: Run REAL provider sklearn estimators, native runtime and local trusted save/load
        run: python -m pytest -q tests/phm_design/test_r94_torch_like_bridge.py -k real_torch_like
        env:
          PYTHONPATH: src
