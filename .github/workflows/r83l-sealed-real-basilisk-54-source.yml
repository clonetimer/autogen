name: R83l Sealed Original Basilisk 54-case RW Source Evidence Audit

# ORIGINAL SHA-backed real-source audit #40157485052 has passed.
# Subsequent doc/PR changes must not retrigger reanalysis and cannot mutate
# the original metadata-shadow finding. Explicit workflow_dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  anti-fabrication-physics-proof:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pip install -e ./source_product --no-deps
      - name: Do not mistake synthetic examples for original Basilisk source
        run: python -m pytest -q source_product/tests/phm_design/test_r83l_original_native_multiwheel_physics_gate.py

  read-actual-original-4arm-native-bsk:
    needs: anti-fabrication-physics-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download ORIGINAL SatAgentSimulation 4-arm native physics from completed run
        uses: actions/download-artifact@v4
        with:
          name: r83l-original-basilisk-native-54-multicondition-physics
          run-id: 40156825783
          repository: clonetimer/SatAgentSimulation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r83l_sealed_original_source
      - name: Independently recompute 54 native Basilisk cases and 36 fault/normal contrasts
        shell: bash
        run: |
          python -m pip install -e ./source_product --no-deps
          python -m phm_design.industrial.r83l_original_basilisk_multiwheel_physics_gate \
            --source-file "$RUNNER_TEMP/r83l_sealed_original_source/r83l_original_native_54_raw.json" \
            --output "$RUNNER_TEMP/r83l_sealed_real_native_54_physics.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r83l_sealed_real_native_54_physics.json"
          r=json.loads(p.read_text())
          assert r["actual_Basilisk_cases"]==54
          assert r["physical_wheel_initial_condition_groups"]==9
          assert r["shared_healthy_sources"]==18
          assert r["matched_physics_comparisons"]==36
          assert r["source_original_cpp_wheel_torque_derating_checked"]
          assert not r["diagnostic_model_eligibility_confirmed"]
          assert not r["independent_hardware_or_flight_safety_certified"]
          assert not r["stable_release_eligible"]
          assert not r["protected_validation_test_final_accessed"]
          for mode,group in sorted(r["physical_observability_matrix"].items()):
              print("R83L_REAL_NATIVE_OBSERVABILITY_GROUP",mode,group)
          PY
      - name: Archive original source proof, NEVER a diagnostic performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r83l-autogen-original-native-54-physics-source-proof
          retention-days: 21
          if-no-files-found: warn
          path: ${{ runner.temp }}/r83l_sealed_real_native_54_physics.json
