name: R95 Diagnostic Algorithm Design Research

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial_contracts/design_engine.py'
      - 'source_product/src/phm_design/industrial_contracts/design_cli.py'
      - 'source_product/src/phm_design/industrial_contracts/torch_like_bridge.py'
      - 'source_product/tests/phm_design/test_r95_diagnostic_design_engine.py'
      - 'source_product/docs/R95_DIAGNOSTIC_ALGORITHM_DESIGN.md'
      - '.github/workflows/r95-diagnostic-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-design-evidence:
    name: Real sklearn and source-only group design / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install trusted scientific test algorithms and pytest
        run: python -m pip install numpy scipy scikit-learn pytest
      - name: Group-aware algorithm synthesis, real sklearn trials, and role/fit-budget guards
        run: >-
          python -m pytest -q
          tests/phm_design/test_r93_industrial_contracts.py
          tests/phm_design/test_r94_torch_like_bridge.py
          tests/phm_design/test_r94_aas_bridge.py
          tests/phm_design/test_r95_diagnostic_design_engine.py
        env:
          PYTHONPATH: src
      - name: Export frozen TRAIN-only algorithm design proposal
        run: >-
          python -m phm_design.industrial_contracts.design_cli propose
          --equipment examples/industrial_contracts/bearing_equipment.json
          --train-manifest examples/industrial_contracts/bearing_train_only.json
          --trial examples/industrial_contracts/bearing_trial.json
          --output r95-source-study-plan.json
        env:
          PYTHONPATH: src
      - name: Check generated design candidates are non-promotable
        shell: python
        run: |
          from pathlib import Path
          import json
          proposal = json.loads(Path("r95-source-study-plan.json").read_text())
          assert proposal["candidate_count"] >= 2
          assert len(proposal["folds"]) == 4
          assert proposal["training_already_run"] is False
          assert proposal["independent_validation_or_final_accessed"] is False
          assert proposal["evidence_boundary"] == "TRAIN_INTERNAL_EXPLORATION_ONLY"
