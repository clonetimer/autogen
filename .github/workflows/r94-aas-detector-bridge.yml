name: R94 Reuse AAS Detector Decision Interface

on:
  pull_request:
    paths:
      - 'source_product/src/phm_design/industrial_contracts/aas_bridge.py'
      - 'source_product/tests/phm_design/test_r94_aas_bridge.py'
      - 'source_product/docs/R94_AAS_TORCHLIKE_EXECUTION_COMPATIBILITY.md'
      - 'source_product/examples/industrial_contracts/**'
      - '.github/workflows/r94-aas-detector-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aas-protocol-compatibility:
    name: AAS-contract fixture and R93 regression / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    defaults:
      run:
        working-directory: source_product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only dependencies, no torch_like or AAS vendor copy
        run: python -m pip install numpy pytest
      - name: R93 data and roles + R94 AAS three decision modes, no inference leakage
        run: >-
          python -m pytest -q
          tests/phm_design/test_r93_industrial_contracts.py
          tests/phm_design/test_r94_aas_bridge.py
        env:
          PYTHONPATH: src
